[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-review-agentic"
version = "0.1.0"
description = "A zero-cost, stateless, multi-agent pull-request reviewer."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.0.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["harness", "mcp_servers", "evals"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: live network, Docker, GitHub, or model calls; not part of the fast suite",
]
